    <style>
        body {
            font-family: Poppins;
            background: #020617;
            color: white;
            margin: 0;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 30px 15px;
        }

        .card {
            background: #070f24;
            border: 1px solid #111827;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 0 40px rgba(0, 0, 0, .6);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px
        }

        .widget {
            display: flex;
            justify-content: center;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #111827
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px
        }

        @media(max-width:900px) {
            .grid {
                grid-template-columns: 1fr
            }
        }

        .btn {
            display: block;
            text-align: center;
            margin-top: 25px;
            padding: 16px;
            background: #ff0033;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
        }

        .regras {
            background-color: #2b2b2b;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .regras ul {
            padding-left: 20px;
        }

        .footer {
            background-color: #111;
            color: #ccc;
            text-align: center;
            padding: 25px 15px;
            border-top: 2px solid #e60000;
            font-family: 'Arial', sans-serif;
        }

        .footer-apoiar {
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .footer-apoiar span {
            color: #e6b800;
            display: block;
            margin-bottom: 10px;
            font-size: 1.3em;
        }

        .botao-apoio {
            background-color: rgba(230, 184, 0, 0.6);
            color: white;
            font-weight: bold;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 1.2em;
            transition: all 0.3s ease;
        }

        .botao-apoio:hover {
            background-color: #e6b800;
            box-shadow: 0 0 10px #e6b80060;
        }

        .footer-parcerias {
            margin: 20px 0;
            font-size: 1em;
        }

        .footer-parcerias h4 {
            color: #e6b800;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .footer-parcerias p {
            margin: 6px 0;
        }

        .footer-parcerias a {
            color: #ccc;
            text-decoration: none;
            margin: 0 5px;
            transition: color 0.3s ease;
        }

        .footer-parcerias a:hover {
            color: #e6b800;
        }

        .footer-parcerias .oficial {
            color: #00ff88;
        }

        .footer-parcerias .nao-oficial {
            color: #ff5555;
        }

        .footer-aviso {
            font-size: 0.9em;
            color: #aaa;
            margin: 15px 0;
        }

        .social-icons {
            margin: 20px 0 10px;
        }

        .social-icons a {
            color: #e6b800;
            font-size: 1.8em;
            margin: 0 10px;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .social-icons a:hover {
            color: white;
            transform: scale(1.2);
        }

        /* NOVO MENU DE LINKS */
        .footer-menu {
            margin: 10px 0 15px;
        }

        .footer-menu a {
            color: #e6b800;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
            font-size: 1em;
            transition: color 0.3s ease;
        }

        .footer-menu a:hover {
            color: white;
            text-decoration: underline;
        }

        .footer-versao {
            margin-top: 10px;
            font-size: 0.9em;
            color: #777;
        }
    </style>
</head>

        <style>
            body {
                margin: 0;
                font-family: Arial, sans-serif;
                color: #fff;
            }

            .menu {
                display: flex;
                justify-content: space-between;
                align-items: center;
                background-color: #1a1a1a;
                padding: 10px 20px;
                position: sticky;
                top: 0;
                z-index: 1000;
            }

            .logo {
                font-size: 20px;
                font-weight: bold;
                color: #ff4757;
            }

            .logo a {
                color: inherit;
                /* mantém a cor original */
                text-decoration: none;
                /* remove sublinhado */
            }

            .logo a:hover {
                opacity: 0.8;
                /* opcional: efeito no hover */
            }

            .menu-links {
                display: flex;
                list-style: none;
                gap: 15px;
                margin: 0;
                padding: 0;
            }

            .menu-links li a {
                text-decoration: none;
                color: #fff;
                font-size: 14px;
                transition: color 0.3s;
            }

            .menu-links li a:hover {
                color: #1dd1a1;
            }

            .menu-toggle {
                display: none;
                font-size: 26px;
                color: #fff;
                cursor: pointer;
            }

            /* Versão para celular */
            @media (max-width: 768px) {
                .menu-toggle {
                    display: block;
                }

                .menu-links {
                    display: none;
                    flex-direction: column;
                    background-color: #1a1a1a;
                    position: absolute;
                    top: 60px;
                    right: 20px;
                    width: 160px;
                    padding: 10px;
                    border-radius: 8px;
                    box-shadow: 0 0 10px #000;
                }

                .menu-links.active {
                    display: flex;
                }
            }

            .anuncio {

                color: #00ffea;
                text-align: center;
                padding: 12px 10px;
                font-size: 15px;
                font-weight: bold;
            }

            .anuncio a {
                color: #ff0000;
                text-decoration: underline;
            }
        </style>
    </header>

    <script>
        // Menu toggle no celular
        document.getElementById('menu-toggle').onclick = function () {
            document.getElementById('menu-links').classList.toggle('active');
        };
    </script>
